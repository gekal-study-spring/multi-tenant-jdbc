spring:
  sql:
    init:
      # スキーマ・初期データの投入は migration モジュール（Flyway）の責務。
      # アプリ側では一切流さない。
      mode: never

  docker:
    compose:
      # bootRun のワーキングディレクトリは app/ なのでリポジトリ直下を指す
      file: ../compose.yaml
      # アプリ起動時に `up`、停止時に `stop`（コンテナは残すのでマイグレーション結果も保持される）
      lifecycle-management: start-and-stop
      # migration サービスは profile 'migrate' に隔離してあるため自動起動されない
