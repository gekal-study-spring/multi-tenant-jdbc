plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

dependencies {
    // このアプリが実際に使う starter だけを入れる
    // （ルーティング用の JdbcTemplate / HTTP Basic 認証 / Servlet MVC）
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    runtimeOnly libs.postgresql

    // @ConfigurationProperties（app.datasource.*）のメタデータ生成
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // bootRun 時に compose 環境（db0/db1/db2）を自動で起動・停止する
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // JUnit Platform の起動に必要（Spring Initializr 4.1.x が生成する構成に合わせる）
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('bootRun') {
    // compose.yaml はリポジトリ直下にある。起動時の作業ディレクトリに依存しないよう
    // 絶対パスで spring-boot-docker-compose に渡す。
    systemProperty 'spring.docker.compose.file', rootProject.file('compose.yaml')
}
